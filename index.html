<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>星核觉醒 · 重构版</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <!-- 整个游戏只画在这一张画布上。
       width/height 是真实像素；游戏代码里按 960×540 写坐标，
       靠 ctx.setTransform(1.5,0,0,1.5,0,0) 自动放大 1.5 倍 -->
  <canvas id="game" width="1440" height="810"></canvas>

  <!-- 暂停遮罩：平时 hidden；暂停时由 main.js 去掉 hidden 显示 -->
  <div id="pause-menu" class="hidden">
    <div class="pause-panel">
      <!-- 四角科技角标：纯装饰，pointer-events:none 不挡按钮点击 -->
      <span class="panel-corner tl"></span>
      <span class="panel-corner tr"></span>
      <span class="panel-corner bl"></span>
      <span class="panel-corner br"></span>
      <h2>已暂停</h2>
      <p>按 Esc 继续</p>
      <button id="btn-resume" type="button">继续游戏</button>
      <button id="btn-exit-fs" type="button">退出全屏</button>
      <button id="btn-restart" type="button">重新开始</button>
    </div>
  </div>

  <!-- 升级 / 遗物面板：平时 hidden；state='upgrade' 时由 screens.js 填卡显示 -->
  <div id="reward-panel" class="hidden">
    <h2 id="reward-title">核心强化</h2>
    <p id="reward-sub" class="panel-sub"></p>
    <div id="reward-cards"></div>
  </div>

  <!-- 开局选星核：平时 hidden；main.js 启动 / screens.js 填三张元素卡 -->
  <div id="core-panel" class="hidden">
    <h2>选择你的星核</h2>
    <p class="core-sub">主附魔决定你的元素爆发</p>
    <div id="core-cards"></div>
  </div>

  <!-- 选择副元素：第一次拿到「元素混合」时由 systems.js 暂停并弹出 -->
  <div id="secondary-panel" class="hidden">
    <h2>选择副元素</h2>
    <p class="core-sub">元素混合已生效 · 只能选择与主元素不同的元素</p>
    <div id="secondary-cards"></div>
  </div>

  <!-- 遗物装配室：清房选完奖励卡后进入 route 状态，由 screens.js 渲染并处理拖拽 -->
  <div id="route-panel" class="hidden">
    <h2>遗物装配室 · 选择你的装备</h2>
    <p class="core-sub">
      拖动遗物到槽位：普通槽只能放普通遗物，特殊槽只能放特殊遗物
    </p>
    <div id="route-slots"></div>
    <h3>备选库</h3>
    <div id="route-backup"></div>
    <button id="route-continue" type="button">继续深入</button>
  </div>

  <!-- F2 法术调试台：平时隐藏；main.js 负责拖拽、暂停和写回 G.p.relicSlots -->
  <div id="debug-panel" class="hidden">
    <div class="debug-head">
      <div class="dbg-title">F2 // SPELL LAB</div>
      <div class="dbg-hint">拖拽装备 · +/- 调等级 · <span class="keycap">F2</span> 关闭</div>
    </div>

    <div class="debug-body">
      <div class="dbg-col dbg-slots">
        <h3>普通槽位</h3>
        <div id="debug-slots"></div>
      </div>

      <div class="dbg-col dbg-library">
        <h3>备选库</h3>
        <!-- 按钮由 main.js 按遗物表生成，HTML 只留容器，避免两处维护 -->
        <div id="debug-library" class="debug-library"></div>
      </div>

      <div class="dbg-col dbg-specials">
        <h3>特殊遗物</h3>
        <div id="debug-specials" class="debug-specials-list"></div>
      </div>
    </div>

    <!-- 沙盒控制：左侧是运行操作，右侧是破坏性清空，整行放在三栏下方 -->
    <div class="debug-actions">
      <div class="dbg-actions-left">
        <button id="debug-sandbox" type="button">开启沙盒</button>
        <button id="debug-spawn" type="button">刷一波怪</button>
      </div>
      <div class="dbg-actions-right">
        <button id="debug-clear-enemies" type="button">清空怪物</button>
        <button id="debug-clear" type="button">清空遗物</button>
      </div>
    </div>
  </div>

  <!-- ES Module 入口：浏览器会顺着 import 把 src 下的模块依次加载进来。
       注意：必须通过本地服务器访问（双击 file:// 打开会被浏览器拦截模块加载） -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
